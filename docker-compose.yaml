services:
  database:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgh_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgh_db"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
    ports:
      # 15435 e nao 5435: o Windows reserva dinamicamente a faixa 5358-5457
      # (netsh int ipv4 show excludedportrange), e o bind na 5435 falha com
      # "socket access forbidden". A porta interna do container segue 5432.
      - "15435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-init:
    image: postgres:16-alpine
    container_name: postgres-init
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-v", "ON_ERROR_STOP=1",
      "-f", "/docker-entrypoint-initdb.d/criacao_tabela.sql",
      "-f", "/docker-entrypoint-initdb.d/insercao_dados.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/alteracoes.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/insercao_internacoes.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/procedures.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/triggers.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/views.sql"
    ]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: sgh_db
      DB_USER: postgres
      DB_PASSWORD: postgres

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* só tem efeito se entrar no build (ver web/Dockerfile);
        # colocar isto em `environment:` (runtime) seria inerte, porque
        # Next.js inlina NEXT_PUBLIC_* em tempo de build.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      # NEXT_PUBLIC_API_URL não vai aqui: Next.js inlina NEXT_PUBLIC_* em tempo
      # de build, não lê em runtime — por isso o valor usado pelo navegador vem
      # do build.args acima, não de `environment:`. Colocá-lo aqui seria inerte.
      #
      # API_URL_INTERNAL sim é lido em runtime (fetch server-side, Server
      # Components, que roda dentro deste container: aqui "localhost" seria o
      # próprio container `web`, não a API).
      API_URL_INTERNAL: http://api:8000

  testes:
    profiles: ["teste"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: sgh_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: ["uv", "run", "pytest", "-v"]

  concorrencia-sessao-1:
    profiles: ["concorrencia-sql"]
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/sql:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-e", "-f", "/sql/etapa2/concorrencia_sessao1.sql"
    ]

  concorrencia-sessao-2:
    profiles: ["concorrencia-sql"]
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/sql:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-e", "-f", "/sql/etapa2/concorrencia_sessao2.sql"
    ]

volumes:
  postgres_data:
