services:
  database:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgh_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgh_db"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
    ports:
      # 15435 e nao 5435: o Windows reserva dinamicamente a faixa 5358-5457
      # (netsh int ipv4 show excludedportrange), e o bind na 5435 falha com
      # "socket access forbidden". A porta interna do container segue 5432.
      - "15435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-init:
    image: postgres:16-alpine
    container_name: postgres-init
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-v", "ON_ERROR_STOP=1",
      "-f", "/docker-entrypoint-initdb.d/criacao_tabela.sql",
      "-f", "/docker-entrypoint-initdb.d/insercao_dados.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/alteracoes.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/procedures.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/triggers.sql",
      "-f", "/docker-entrypoint-initdb.d/etapa2/views.sql"
    ]
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: sgh_db
      DB_USER: postgres
      DB_PASSWORD: postgres

  testes:
    profiles: ["teste"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: sgh_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: ["uv", "run", "pytest", "-v"]

  concorrencia-sessao-1:
    profiles: ["concorrencia-sql"]
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/sql:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-e", "-f", "/sql/etapa2/concorrencia_sessao1.sql"
    ]

  concorrencia-sessao-2:
    profiles: ["concorrencia-sql"]
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql:/sql:ro
    command: [
      "psql", "-h", "database", "-U", "postgres", "-d", "sgh_db",
      "-e", "-f", "/sql/etapa2/concorrencia_sessao2.sql"
    ]

volumes:
  postgres_data:
